<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="百年中环 - 一款水彩风格的网页导览，探索香港中环五大历史地标">
  <meta name="theme-color" content="#F5F0E8">
  <title>百年中环 · 水彩导览</title>
  
  <link rel="stylesheet" href="css/style.css?v=11">
  
  <!-- Google Fonts: Noto Serif SC (铅字印刷感) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "meshoptimizer": "https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.module.js"
      }
    }
  </script>
</head>
<body>
  
  <!-- 加载画面 -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">百年中环</div>
  </div>

  <!-- 入场画面 -->
  <div class="splash-screen" id="splash-screen">
    <div class="splash-content">
      <h1 class="splash-title">点击进入百年中环</h1>
      <div class="splash-btn">轻触屏幕继续</div>
    </div>
  </div>

  <!-- 应用容器 -->
  <div class="app" id="app">

    <!-- ====== 首页：水彩地图 ====== -->
    <div class="view map-view view-visible" id="view-home">
      <header class="map-header">
        <h1 class="map-title">百年中环</h1>
        <p class="map-subtitle">Central: A Century of History</p>
      </header>
      
      <div class="map-scroll-view" id="map-scroll-view">
        <div class="map-container" id="map-container">
          <img 
            class="map-image" 
            id="map-image"
            src="assets/images/map.png?v=2" 
            alt="百年中环水彩地图"
          onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22900%22 height=%22506%22><rect fill=%22%23F5F0E8%22 width=%22900%22 height=%22506%22/><text x=%22450%22 y=%22253%22 text-anchor=%22middle%22 fill=%22%234A7B9D%22 font-family=%22serif%22 font-size=%2220%22>百年中环 · 水彩地图</text></svg>'"
        >
        <div class="map-markers" id="map-markers"></div>
        
        <!-- 建筑描边层（SVG 叠加） -->
        <svg class="map-outline" viewBox="0 0 900 506" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- 裁剪路径 -->
            <clipPath id="clip-duddell">
              <polygon points="194,201 210,201 210,223 253,223 253,201 269,201 283,284 283,350 173,350 173,284" />
            </clipPath>
            <clipPath id="clip-cfa">
              <polygon points="453,229 453,184 477,169 512,146 542,146 581,169 620,184 620,229" />
            </clipPath>
            <clipPath id="clip-sq">
              <polygon points="382,259 376,155 394,126 422,126 434,155 428,259" />
            </clipPath>
            <clipPath id="clip-boc">
              <polygon points="581,350 581,295 598,255 615,215 631,180 647,215 664,255 681,295 681,350" />
            </clipPath>
            <clipPath id="clip-sjc">
              <polygon points="417,276 424,284 428,300 502,322 506,361 502,400 468,422 428,432 401,428 367,414 364,367 368,306 407,284" />
            </clipPath>
            <!-- 外框线模糊滤镜 -->
            <filter id="blur-border" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5" />
            </filter>

            <!-- ===== 增强型柔和发光滤镜（双层模糊，性能优化版） ===== -->
            <!-- 建筑光晕：两层高斯模糊叠加 → 柔和亮金光晕（区域与层数精简以降低滤镜重算开销） -->
            <filter id="glow-aura" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="glow1" />
              <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="glow2" />
              <feMerge>
                <feMergeNode in="glow1" />
                <feMergeNode in="glow2" />
              </feMerge>
            </filter>

            <!-- 文字标签光晕：基于文字轮廓(SourceAlpha)模糊上色 → 文字锐利 + 边缘柔和发光 -->
            <filter id="glow-label" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="gl1" />
              <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="gl2" />
              <feFlood flood-color="#FFE9B8" flood-opacity="0.95" result="fl1" />
              <feFlood flood-color="#FFDE9E" flood-opacity="0.55" result="fl2" />
              <feComposite in="fl1" in2="gl1" operator="in" result="c1" />
              <feComposite in="fl2" in2="gl2" operator="in" result="c2" />
              <feMerge>
                <feMergeNode in="c1" />
                <feMergeNode in="c2" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

                      <!-- 圣约翰座堂 热点 -->
          <g class="building-hotspot" data-site="0">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="417,276 424,284 428,300 502,322 506,361 502,400 468,422 428,432 401,428 367,414 364,367 368,306 407,284" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="417,276 424,284 428,300 502,322 506,361 502,400 468,422 428,432 401,428 367,414 364,367 368,306 407,284" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/sjc-透明底.png"
              x="371" y="283"
              width="132" height="142"
              clip-path="url(#clip-sjc)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="417,276 424,284 428,300 502,322 506,361 502,400 468,422 428,432 401,428 367,414 364,367 368,306 407,284" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="435" y="440" text-anchor="middle">圣约翰座堂</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="417,276 424,284 428,300 502,322 506,361 502,400 468,422 428,432 401,428 367,414 364,367 368,306 407,284" />
          </g>

          <!-- 中银大厦 热点 -->
          <g class="building-hotspot" data-site="4">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="581,350 581,295 598,255 615,215 631,180 647,215 664,255 681,295 681,350" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="581,350 581,295 598,255 615,215 631,180 647,215 664,255 681,295 681,350" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/boc-透明底.png"
              x="568" y="178"
              width="139" height="174"
              clip-path="url(#clip-boc)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="581,350 581,295 598,255 615,215 631,180 647,215 664,255 681,295 681,350" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="638" y="370" text-anchor="middle">中银大厦</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="581,350 581,295 598,255 615,215 631,180 647,215 664,255 681,295 681,350" />
          </g>

          <!-- 皇后像广场 热点 -->
          <g class="building-hotspot" data-site="2">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="382,259 376,155 394,126 422,126 434,155 428,259" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="382,259 376,155 394,126 422,126 434,155 428,259" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/sq-透明底.png"
              x="378" y="133"
              width="54" height="119"
              clip-path="url(#clip-sq)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="382,259 376,155 394,126 422,126 434,155 428,259" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="405" y="270" text-anchor="middle">皇后像广场</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="382,259 376,155 394,126 422,126 434,155 428,259" />
          </g>

          <!-- 终审法院大楼 热点 -->
          <g class="building-hotspot" data-site="3">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="453,229 453,184 477,169 512,146 542,146 581,169 620,184 620,229" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="453,229 453,184 477,169 512,146 542,146 581,169 620,184 620,229" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/cfa-透明底.png"
              x="462" y="149"
              width="149" height="77"
              clip-path="url(#clip-cfa)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="453,229 453,184 477,169 512,146 542,146 581,169 620,184 620,229" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="537" y="244" text-anchor="middle">终审法院大楼</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="453,229 453,184 477,169 512,146 542,146 581,169 620,184 620,229" />
          </g>

          <!-- 都爹利街煤气灯 热点 -->
          <g class="building-hotspot" data-site="1">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="194,201 210,201 210,223 253,223 253,201 269,201 283,284 283,350 173,350 173,284" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="194,201 210,201 210,223 253,223 253,201 269,201 283,284 283,350 173,350 173,284" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/duddell-透明底.png"
              x="178" y="209"
              width="100" height="135"
              clip-path="url(#clip-duddell)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="194,201 210,201 210,223 253,223 253,201 269,201 283,284 283,350 173,350 173,284" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="228" y="360" text-anchor="middle">都爹利街煤气灯</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="194,201 210,201 210,223 253,223 253,201 269,201 283,284 283,350 173,350 173,284" />
          </g>
        </svg>
      </div>
      </div>

      <!-- 引导提示 -->
      <div class="guide-tip" id="guide-tip">点击建筑，探索百年中环</div>
      
      <!-- 关于 -->
      <div class="about-btn" id="about-btn">关于 · About</div>
    </div>

  </div>

  <!-- 建筑详情弹出窗口（在 app 外部，确保 fixed 定位不受 overflow 影响） -->
  <div class="popup-overlay" id="popup-overlay">
    <div class="popup-window">
      <button class="popup-close-btn" id="popup-close-btn">✕</button>
      
      <!-- 音频播放器 -->
      <audio id="popup-audio" preload="auto"></audio>
      <button class="popup-audio-btn" id="popup-audio-btn" title="播放介绍音频">
        <img class="audio-icon" src="assets/images/laba.png" alt="播放" />
      </button>
      
      <!-- 左箭头 -->
      <button class="popup-arrow popup-arrow-left" id="popup-arrow-left">‹</button>
      <!-- 右箭头 -->
      <button class="popup-arrow popup-arrow-right" id="popup-arrow-right">›</button>

      <!-- 滑动面板容器 -->
      <div class="popup-content" id="popup-content">
        <div class="popup-slider-track" id="popup-slider-track">
          
          <!-- 面板0：3D模型 -->
          <div class="popup-panel popup-panel-model" data-panel="0">
            <div class="model-container" id="popup-model-container"></div>
            <div class="model-loading-text" id="model-loading-text">3D 模型加载中，请稍后</div>
            <div class="model-hint">↔ 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放</div>
          </div>

          <!-- 面板1：基本介绍 -->
          <div class="popup-panel popup-panel-intro" data-panel="1">
            <h2 class="popup-intro-title" id="popup-intro-title"></h2>
            <p class="popup-intro-subtitle" id="popup-intro-subtitle"></p>
            <div class="popup-divider"></div>
            <p class="popup-intro-text" id="popup-intro-p1"></p>
            <p class="popup-intro-text" id="popup-intro-p2"></p>
          </div>

          <!-- 面板2：冷知识 ① -->
          <div class="popup-panel popup-panel-fact" data-panel="2">
            <span class="fact-badge">冷知识 ①</span>
            <h3 class="fact-title" id="popup-fact1-title"></h3>
            <div class="popup-divider"></div>
            <p class="fact-text" id="popup-fact1-text"></p>
          </div>

          <!-- 面板3：冷知识 ② -->
          <div class="popup-panel popup-panel-fact" data-panel="3">
            <span class="fact-badge">冷知识 ②</span>
            <h3 class="fact-title" id="popup-fact2-title"></h3>
            <div class="popup-divider"></div>
            <p class="fact-text" id="popup-fact2-text"></p>
          </div>

          <!-- 面板4：隐藏机位 -->
          <div class="popup-panel popup-panel-photo" data-panel="4">
            <img class="photo-spot-icon" src="assets/images/camera-icon.png" alt="相机" />
            <span class="photo-spot-badge">隐藏机位</span>
            <p class="photo-spot-text" id="popup-photo-text"></p>
          </div>

        </div>
      </div>

      <!-- 页面指示点 -->
      <div class="popup-dots" id="popup-dots">
        <span class="popup-dot active" data-dot="0"></span>
        <span class="popup-dot" data-dot="1"></span>
        <span class="popup-dot" data-dot="2"></span>
        <span class="popup-dot" data-dot="3"></span>
        <span class="popup-dot" data-dot="4"></span>
      </div>
    </div>
  </div>

  <!-- BGM 切换按钮 -->
  <button class="bgm-toggle" id="bgm-toggle" aria-label="背景音乐开关">
    <img class="audio-icon audio-icon--bgm" src="assets/images/laba.png" alt="背景音乐" />
  </button>

  <!-- 关于弹窗 -->
  <div class="about-modal" id="about-modal">
    <div class="about-content">
      <h3>关于百年中环</h3>
      <p>这是一款水彩手绘风格的中环历史导览网页，串联五座地标建筑，带你走进香港百年的城市记忆。</p>
      <p style="font-size:12px;color:var(--color-text-light);">内容来源于实地考察与公开史料<br>3D模型：Meshy生成<br>语音：MINIMAX语音<br>网站搭建：CodeBuddy</p>
      <p style="font-size:12px;color:var(--color-text-light);">© 2026 百年中环</p>
      <button class="about-close" id="about-close-btn">关闭</button>
    </div>
  </div>

  <!-- Three.js -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'meshoptimizer';
    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
    window.GLTFLoader = GLTFLoader;
    window.DRACOLoader = DRACOLoader;
    window.MeshoptDecoder = MeshoptDecoder;

    // 等待 MeshoptDecoder ready 后才允许使用 GLTFLoader
    MeshoptDecoder.ready.then(() => {
      console.log('[Mesh] MeshoptDecoder 已就绪');
      window.dispatchEvent(new Event('three-ready'));
    });
  </script>

  <!-- 应用脚本 -->
  <script src="js/content.js?v=5"></script>
  <script src="js/three-viewer.js?v=6"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
