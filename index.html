<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="百年中环 - 一款水彩风格的网页导览，探索香港中环五大历史地标">
  <meta name="theme-color" content="#F5F0E8">
  <title>百年中环 · 水彩导览</title>
  
  <link rel="stylesheet" href="css/style.css?v=4">
  
  <!-- Google Fonts: Noto Serif SC (铅字印刷感) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "meshoptimizer": "https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.module.js"
      }
    }
  </script>
</head>
<body>
  
  <!-- 加载画面 -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">百年中环</div>
  </div>

  <!-- 入场画面 -->
  <div class="splash-screen" id="splash-screen">
    <div class="splash-content">
      <h1 class="splash-title">点击进入百年中环</h1>
      <div class="splash-btn">轻触屏幕继续</div>
    </div>
  </div>

  <!-- 应用容器 -->
  <div class="app" id="app">

    <!-- ====== 首页：水彩地图 ====== -->
    <div class="view map-view view-visible" id="view-home">
      <header class="map-header">
        <h1 class="map-title">百年中环</h1>
        <p class="map-subtitle">Central: A Century of History</p>
      </header>
      
      <div class="map-scroll-view" id="map-scroll-view">
        <div class="map-container" id="map-container">
          <img 
            class="map-image" 
            id="map-image"
            src="assets/images/map.png?v=2" 
            alt="百年中环水彩地图"
          onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22900%22 height=%22506%22><rect fill=%22%23F5F0E8%22 width=%22900%22 height=%22506%22/><text x=%22450%22 y=%22253%22 text-anchor=%22middle%22 fill=%22%234A7B9D%22 font-family=%22serif%22 font-size=%2220%22>百年中环 · 水彩地图</text></svg>'"
        >
        <div class="map-markers" id="map-markers"></div>
        
        <!-- 建筑描边层（SVG 叠加） -->
        <svg class="map-outline" viewBox="0 0 900 506" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- 裁剪路径 -->
            <clipPath id="clip-duddell">
              <polygon points="198,211 212,211 212,230 250,230 250,211 264,211 276,283 276,340 180,340 180,283" />
            </clipPath>
            <clipPath id="clip-cfa">
              <polygon points="464,224 464,184 485,171 515,151 541,151 575,171 609,184 609,224" />
            </clipPath>
            <clipPath id="clip-sq">
              <polygon points="385,250 380,160 395,135 420,135 430,160 425,250" />
            </clipPath>
            <clipPath id="clip-boc">
              <polygon points="610,350 615,320 630,220 645,180 655,220 665,320 665,350" />
            </clipPath>
            <clipPath id="clip-sjc">
              <polygon points="419,286 425,293 429,307 493,326 497,360 493,394 464,413 429,422 405,418 376,406 373,365 377,312 411,293" />
            </clipPath>
            <!-- 外框线模糊滤镜 -->
            <filter id="blur-border" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5" />
            </filter>
          </defs>

                      <!-- 圣约翰座堂 热点 -->
          <g class="building-hotspot" data-site="0">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="419,286 425,293 429,307 493,326 497,360 493,394 464,413 429,422 405,418 376,406 373,365 377,312 411,293" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="419,286 425,293 429,307 493,326 497,360 493,394 464,413 429,422 405,418 376,406 373,365 377,312 411,293" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/sjc-透明底.png"
              x="371" y="283"
              width="132" height="142"
              clip-path="url(#clip-sjc)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="419,286 425,293 429,307 493,326 497,360 493,394 464,413 429,422 405,418 376,406 373,365 377,312 411,293" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="435" y="440" text-anchor="middle">圣约翰座堂</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="419,286 425,293 429,307 493,326 497,360 493,394 464,413 429,422 405,418 376,406 373,365 377,312 411,293" />
          </g>

          <!-- 中银大厦 热点 -->
          <g class="building-hotspot" data-site="4">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="610,350 615,320 630,220 645,180 655,220 665,320 665,350" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="610,350 615,320 630,220 645,180 655,220 665,320 665,350" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/boc-透明底.png"
              x="608" y="178"
              width="59" height="174"
              clip-path="url(#clip-boc)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="610,350 615,320 630,220 645,180 655,220 665,320 665,350" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="638" y="370" text-anchor="middle">中银大厦</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="610,350 615,320 630,220 645,180 655,220 665,320 665,350" />
          </g>

          <!-- 皇后像广场 热点 -->
          <g class="building-hotspot" data-site="2">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="385,250 380,160 395,135 420,135 430,160 425,250" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="385,250 380,160 395,135 420,135 430,160 425,250" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/sq-透明底.png"
              x="378" y="133"
              width="54" height="119"
              clip-path="url(#clip-sq)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="385,250 380,160 395,135 420,135 430,160 425,250" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="405" y="270" text-anchor="middle">皇后像广场</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="385,250 380,160 395,135 420,135 430,160 425,250" />
          </g>

          <!-- 终审法院大楼 热点 -->
          <g class="building-hotspot" data-site="3">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="464,224 464,184 485,171 515,151 541,151 575,171 609,184 609,224" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="464,224 464,184 485,171 515,151 541,151 575,171 609,184 609,224" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/cfa-透明底.png"
              x="462" y="149"
              width="149" height="77"
              clip-path="url(#clip-cfa)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="464,224 464,184 485,171 515,151 541,151 575,171 609,184 609,224" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="537" y="244" text-anchor="middle">终审法院大楼</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="464,224 464,184 485,171 515,151 541,151 575,171 609,184 609,224" />
          </g>

          <!-- 都爹利街煤气灯 热点 -->
          <g class="building-hotspot" data-site="1">
            <!-- 呼吸灯光晕层 -->
            <polygon class="building-aura" points="198,211 212,211 212,230 250,230 250,211 264,211 276,283 276,340 180,340 180,283" />
            <!-- 模糊描边层 -->
            <polygon class="building-aura-blur" filter="url(#blur-border)" points="198,211 212,211 212,230 250,230 250,211 264,211 276,283 276,340 180,340 180,283" />
            <!-- 裁剪后的透明图片 -->
            <image
              class="building-img"
              href="assets/images/duddell-透明底.png"
              x="178" y="209"
              width="100" height="135"
              clip-path="url(#clip-duddell)"
              preserveAspectRatio="xMidYMid slice"
            />
            <!-- 描边框 -->
            <polygon class="building-outline" points="198,211 212,211 212,230 250,230 250,211 264,211 276,283 276,340 180,340 180,283" />
            <!-- 建筑名称标签 -->
            <text class="building-label" x="228" y="360" text-anchor="middle">都爹利街煤气灯</text>
            <!-- 不可见点击目标 -->
            <polygon class="hotspot-hitarea" points="198,211 212,211 212,230 250,230 250,211 264,211 276,283 276,340 180,340 180,283" />
          </g>
        </svg>
      </div>
      </div>

      <!-- 引导提示 -->
      <div class="guide-tip" id="guide-tip">点击建筑，探索百年中环</div>
      
      <!-- 关于 -->
      <div class="about-btn" id="about-btn">关于 · About</div>
    </div>

  </div>

  <!-- 建筑详情弹出窗口（在 app 外部，确保 fixed 定位不受 overflow 影响） -->
  <div class="popup-overlay" id="popup-overlay">
    <div class="popup-window">
      <button class="popup-close-btn" id="popup-close-btn">✕</button>
      
      <!-- 音频播放器 -->
      <audio id="popup-audio" preload="auto"></audio>
      <button class="popup-audio-btn" id="popup-audio-btn" title="播放介绍音频">
        <svg class="audio-icon-play" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg class="audio-icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      
      <!-- 左箭头 -->
      <button class="popup-arrow popup-arrow-left" id="popup-arrow-left">‹</button>
      <!-- 右箭头 -->
      <button class="popup-arrow popup-arrow-right" id="popup-arrow-right">›</button>

      <!-- 滑动面板容器 -->
      <div class="popup-content" id="popup-content">
        <div class="popup-slider-track" id="popup-slider-track">
          
          <!-- 面板0：3D模型 -->
          <div class="popup-panel popup-panel-model" data-panel="0">
            <div class="model-container" id="popup-model-container"></div>
            <div class="model-hint">↔ 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放</div>
          </div>

          <!-- 面板1：基本介绍 -->
          <div class="popup-panel popup-panel-intro" data-panel="1">
            <h2 class="popup-intro-title" id="popup-intro-title"></h2>
            <p class="popup-intro-subtitle" id="popup-intro-subtitle"></p>
            <div class="popup-divider"></div>
            <p class="popup-intro-text" id="popup-intro-p1"></p>
            <p class="popup-intro-text" id="popup-intro-p2"></p>
          </div>

          <!-- 面板2：冷知识 ① -->
          <div class="popup-panel popup-panel-fact" data-panel="2">
            <span class="fact-badge">冷知识 ①</span>
            <h3 class="fact-title" id="popup-fact1-title"></h3>
            <div class="popup-divider"></div>
            <p class="fact-text" id="popup-fact1-text"></p>
          </div>

          <!-- 面板3：冷知识 ② -->
          <div class="popup-panel popup-panel-fact" data-panel="3">
            <span class="fact-badge">冷知识 ②</span>
            <h3 class="fact-title" id="popup-fact2-title"></h3>
            <div class="popup-divider"></div>
            <p class="fact-text" id="popup-fact2-text"></p>
          </div>

          <!-- 面板4：隐藏机位 -->
          <div class="popup-panel popup-panel-photo" data-panel="4">
            <img class="photo-spot-icon" src="assets/images/camera-icon.png" alt="相机" />
            <span class="photo-spot-badge">隐藏机位</span>
            <p class="photo-spot-text" id="popup-photo-text"></p>
          </div>

        </div>
      </div>

      <!-- 页面指示点 -->
      <div class="popup-dots" id="popup-dots">
        <span class="popup-dot active" data-dot="0"></span>
        <span class="popup-dot" data-dot="1"></span>
        <span class="popup-dot" data-dot="2"></span>
        <span class="popup-dot" data-dot="3"></span>
        <span class="popup-dot" data-dot="4"></span>
      </div>
    </div>
  </div>

  <!-- BGM 切换按钮 -->
  <button class="bgm-toggle" id="bgm-toggle" aria-label="背景音乐开关">🔊</button>

  <!-- 关于弹窗 -->
  <div class="about-modal" id="about-modal">
    <div class="about-content">
      <h3>关于百年中环</h3>
      <p>这是一款水彩手绘风格的中环历史导览网页，串联五座地标建筑，带你走进香港百年的城市记忆。</p>
      <p style="font-size:12px;color:var(--color-text-light);">内容来源于实地考察与公开史料<br>3D模型：Meshy生成<br>语音：MINIMAX语音<br>网站搭建：CodeBuddy</p>
      <p style="font-size:12px;color:var(--color-text-light);">© 2026 百年中环</p>
      <button class="about-close" id="about-close-btn">关闭</button>
    </div>
  </div>

  <!-- Three.js -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'meshoptimizer';
    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
    window.GLTFLoader = GLTFLoader;
    window.DRACOLoader = DRACOLoader;
    window.MeshoptDecoder = MeshoptDecoder;

    // 等待 MeshoptDecoder ready 后才允许使用 GLTFLoader
    MeshoptDecoder.ready.then(() => {
      console.log('[Mesh] MeshoptDecoder 已就绪');
      window.dispatchEvent(new Event('three-ready'));
    });
  </script>

  <!-- 应用脚本 -->
  <script src="js/content.js?v=5"></script>
  <script src="js/three-viewer.js?v=6"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
